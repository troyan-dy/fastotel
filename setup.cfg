# flake8 runs only wemake-python-styleguide (`make lint`); ruff lints and formats the rest, so the two share the
# line length and nothing else is selected here. flake8 reads no pyproject.toml.
[flake8]
select = WPS
max-line-length = 120
exclude = .git,.venv,.bench,build,dist,target,__pycache__
per-file-ignores =
  # The public API of the package: the native module, the processor and the version, re-exported
  python/fastotel/__init__.py: WPS410, WPS412
  # Command-line scripts, one file each, whose output is what they print; version.py uses only the standard
  # library, as CI runs it before installing anything
  scripts/version.py: WPS202, WPS421
  bench/sink.py: WPS421
  # The workload is the benchmark: its numbers are what is measured, named by the docstrings
  bench/workload.py: WPS432
  # The pyperf entry point: workers call its functions by reference, so the module holds the whole harness
  bench/run.py: WPS201, WPS202
  # The one Markdown table of the results and its number formats, printed
  bench/table.py: WPS202, WPS210, WPS221, WPS231, WPS237, WPS421
  # Tests: the numbers and strings are the cases themselves; names are sentences; a module holds the tests of one
  # subject, with their asserts and locals; `[span] = spans` checks there is exactly one; a comparison with [] or 0
  # or a float checks the exact value; a thread's body is defined in the test whose state it shares
  tests/*.py bench/test_harness.py: WPS114, WPS118, WPS201, WPS202, WPS204, WPS210, WPS213, WPS218, WPS221, WPS226, WPS359, WPS414, WPS430, WPS432, WPS459, WPS460, WPS520
