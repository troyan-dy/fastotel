name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  version:
    # A pull request into master is a release once merged, so it must carry a new version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base branch and the tags
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --no-project python scripts/version.py check "origin/${{ github.base_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group bench
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is free-threaded; 3.15 and 3.15t are pre-releases, built from source here to catch breakage early
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  bench:
    # The harness of make bench, one value per benchmark; the measurements themselves need a quiet machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group bench
      - run: uv run pytest bench

  wheels:
    # Release builds the same wheels; a pull request finds out first
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/wheels.yml
