name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  version:
    # A pull request into master is a release once merged, so it must carry a new version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the base branch and the tags
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project python scripts/version.py check "origin/${{ github.base_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  wheels:
    # Release builds the same wheels; a pull request finds out first
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/wheels.yml
