name: Wheels

# Builds the sdist and a wheel per platform, then runs the tests against each wheel on the oldest and the newest
# supported Python. CI calls it on every pull request so a release never meets a broken build first; Release
# calls it to get what it publishes.
on:
  workflow_call:

jobs:
  wheels:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, test: true }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, test: true }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64, test: true }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@v6
        if: matrix.platform.test
      - name: Test the wheel
        if: matrix.platform.test
        shell: bash
        run: |
          for python in 3.11 3.14; do
            uv run --isolated --no-project --python "$python" --with pytest --with dist/*.whl \
              pytest -p no:cacheprovider tests
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/
