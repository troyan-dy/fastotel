name: Wheels

# Builds the sdist and, per platform, an abi3 wheel for every CPython from 3.11 on plus a cp314t wheel for the
# free-threaded 3.14, which the stable ABI does not cover. Each wheel is tested on its own runner. CI calls it on every pull request so a release never meets a broken build first; Release
# calls it to get what it publishes.
on:
  workflow_call:

jobs:
  wheels:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, test: true }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, test: true }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64, test: true }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Choose the interpreters
        id: interpreters
        shell: bash
        run: |
          # The manylinux and musllinux containers bring every CPython; elsewhere uv installs them
          if [ "$RUNNER_OS" = Linux ]; then
            echo "args=python3.11 python3.14t" >> "$GITHUB_OUTPUT"
          else
            uv python install 3.11 3.14t
            echo "args=$(uv python find 3.11) $(uv python find 3.14t)" >> "$GITHUB_OUTPUT"
          fi
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --interpreter ${{ steps.interpreters.outputs.args }}
      - name: Test the wheels
        if: matrix.platform.test
        shell: bash
        run: |
          check() {
            uv run --isolated --no-project --python "$1" --with pytest --with "$(ls dist/*-"$2"-*.whl)" \
              pytest -p no:cacheprovider tests
          }
          # +gil: with 3.14t installed, a bare 3.14 may resolve to the free-threaded build
          check 3.11 abi3
          check 3.14+gil abi3
          check 3.15+gil abi3  # a pre-release: the abi3 wheel has to keep working on it
          check 3.14t cp314t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/
