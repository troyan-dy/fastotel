name: Wheels

# Builds the sdist and, per platform, an abi3 wheel for every CPython from 3.11 on plus a cp314t wheel for the
# free-threaded 3.14, which the stable ABI does not cover. Each wheel is tested on its own runner. CI calls it on every pull request so a release never meets a broken build first; Release
# calls it to get what it publishes.
on:
  workflow_call:

jobs:
  wheels:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # python: the platform part of a uv interpreter key, for the interpreters installed on the runner. It is
        # spelled out because uv picks emulated x86_64 builds on Windows arm64, and a bare 3.14 may resolve to an
        # installed 3.14t.
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, python: linux-x86_64-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, python: linux-aarch64-gnu }
          # The tests would need a musl host; these wheels are only built
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, python: macos-x86_64-none }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, python: macos-aarch64-none }
          - { name: windows-x64, runner: windows-latest, target: x64, python: windows-x86_64-none }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64, python: windows-aarch64-none }
    env:
      PLATFORM: ${{ matrix.platform.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the interpreters
        if: matrix.platform.python
        shell: bash
        run: uv python install "cpython-3.11-$PLATFORM" "cpython-3.14-$PLATFORM" "cpython-3.15-$PLATFORM" "cpython-3.14+freethreaded-$PLATFORM"
      - name: Choose the interpreters to build for
        id: interpreters
        shell: bash
        run: |
          # The manylinux and musllinux containers bring every CPython; elsewhere the build uses uv's
          if [ "$RUNNER_OS" = Linux ]; then
            echo "args=python3.11 python3.14t" >> "$GITHUB_OUTPUT"
          else
            echo "args=$(uv python find "cpython-3.11-$PLATFORM") $(uv python find "cpython-3.14+freethreaded-$PLATFORM")" >> "$GITHUB_OUTPUT"
          fi
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --interpreter ${{ steps.interpreters.outputs.args }}
      - name: Test the wheels
        if: matrix.platform.python
        shell: bash
        run: |
          check() {
            uv run --isolated --no-project --python "cpython-$1-$PLATFORM" --with pytest --with opentelemetry-proto \
              --with "$(ls dist/*-"$2"-*.whl)" \
              pytest -p no:cacheprovider tests
          }
          check 3.11 abi3
          check 3.14 abi3
          check 3.15 abi3  # a pre-release: the abi3 wheel has to keep working on it
          check 3.14+freethreaded cp314t
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/
